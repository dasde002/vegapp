spring.application.name=vegetable-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/vegetable_db
spring.datasource.username=veguser
spring.datasource.password=StrongPassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=VegetableMarketSuperSecretKey2026ForJwtSecurityProductionChangeMe
jwt.expiration=86400000

# Razorpay credentials are supplied through environment variables.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
