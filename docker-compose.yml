services:

  vegetable-backend:
    image: vegetable-backend:1.0
    container_name: vegetable-backend

    ports:
      - "8080:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/vegetable_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}

    restart: unless-stopped

  vegetable-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vegapp-frontend:1.0
    container_name: vegetable-frontend

    ports:
      - "80:80"

    depends_on:
      vegetable-backend:
        condition: service_healthy

    restart: unless-stopped
